<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project | John Paul Mina</title>
    <link rel="icon" type="image/svg+xml" href="../../fav-icon-paulmina.svg">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://use.typekit.net/tsj5iyf.css">
    <script src="../../js/site.js" defer></script>
    <script>window.PAGE_DEPTH = 2; window.PROJECT_KIND = "projects";</script>
    <script src="../../js/portfolio-data.js" defer></script>
    <script src="../../js/portfolio-list.js" defer></script>
    <script src="../../js/project-page.js" defer></script>
</head>
<body>
    <header class="header">
        <nav class="navbar grid">
            <ul class="nav-links nav-links-left" aria-label="Primary">
                <li><a href="../../work/">Work</a></li>
                <li><a href="../" aria-current="page">Projects</a></li>
            </ul>
            <a class="nav-brand" href="../../">Paul Mina</a>
            <div class="nav-actions">
                <ul class="nav-links nav-links-right" id="nav-menu" aria-label="More pages">
                    <li><a href="../../about/">About</a></li>
                    <li><a href="https://drive.google.com/uc?export=download&id=1vdA2akuF-rzuMxPUj3U-x4-tLHDCXf58">Resume</a></li>
                </ul>
                <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-menu"><span></span><span></span><span></span></button>
                <button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false"><span class="theme-toggle-thumb"></span></button>
            </div>
        </nav>
    </header>
    <main class="grid page-content">
        <article class="project-detail" data-project-detail>
            <a class="project-back" href="../">&larr; All projects</a>
            <div class="project-overview">
                <header class="project-heading">
                    <span class="project-category" data-project-category></span>
                    <h1 data-project-title></h1>
                    <p data-project-summary></p>
                </header>
                <dl class="project-meta">
                    <div><dt>Category</dt><dd data-project-category></dd></div>
                    <div><dt>Scope of work</dt><dd data-project-scope></dd></div>
                </dl>
            </div>
            <section class="project-gallery" data-project-gallery aria-label="Project gallery"></section>
            <section class="related-work" aria-labelledby="related-title">
                <h2 id="related-title">Check out my other works</h2>
                <div class="work-grid" data-related-grid></div>
            </section>
        </article>
    </main>
</body>
</html>
