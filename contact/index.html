<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | John Paul Mina</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://use.typekit.net/tsj5iyf.css">
    <script src="../js/site.js" defer></script>
</head>
<body>
    <header class="header">
        <nav class="navbar grid">
            <ul class="nav-links nav-links-left" aria-label="Primary">
                <li><a href="../work/">Work</a></li>
                <li><a href="../projects/">Projects</a></li>
            </ul>
            <a class="nav-brand" href="../">Paul Mina</a>
            <div class="nav-actions">
                <ul class="nav-links nav-links-right" id="nav-menu" aria-label="More pages">
                    <li><a href="../about/">About</a></li>
                    <li><a href="https://drive.google.com/uc?export=download&id=1_w5dz47R4NOOSGnhBnN8owQGXWTWglsf">Resume</a></li>
                </ul>
                <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav-menu">
                    <span></span><span></span><span></span>
                </button>
                <button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">
                    <span class="theme-toggle-thumb"></span>
                </button>
            </div>
        </nav>
    </header>
    <main class="grid page-content contact-page">
        <section class="contact-panel" aria-labelledby="contact-title">
            <h1 class="contact-title" id="contact-title">Contact</h1>
            <form class="contact-form" id="contact-form" action="https://formsubmit.co/ajax/johnpaul.mina@gmail.com" method="post">
                <input type="hidden" name="_subject" value="New portfolio contact">
                <div class="contact-field">
                    <label for="contact-name">Name <span aria-hidden="true">*</span></label>
                    <input id="contact-name" name="name" type="text" placeholder="Your name..." autocomplete="name" required>
                </div>
                <div class="contact-field">
                    <label for="contact-email">Email address <span aria-hidden="true">*</span></label>
                    <input id="contact-email" name="email" type="email" placeholder="Your email address..." autocomplete="email" required>
                </div>
                <div class="contact-field">
                    <label for="contact-message">Message <span aria-hidden="true">*</span></label>
                    <textarea id="contact-message" name="message" placeholder="Your message..." required></textarea>
                </div>
                <button class="contact-submit" type="submit">Submit</button>
            </form>
            <div class="contact-success" id="contact-success" role="status" aria-live="polite" hidden>
                <p>Thank you for reaching out. I will be in touch ASAP!</p>
                <p>For now, check out my other <a href="../work/">works</a>.</p>
            </div>
            <p class="contact-feedback" id="contact-feedback" role="alert" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
